<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Delights | Order a Cake</title>
</head>
<body>

    <header>
        <img src="images/logo.png" alt="Divine Delights Logo" width="150">
        <h1>Divine Delights</h1>
        <p><em>Made with Love, Served with Honor</em></p>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about_us.html">About Us</a></li>
                <li><a href="menu.html">Menu &amp; Prices</a></li>
                <li><a href="order.html">Order a Cake</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section>
            <h2>Custom Cake Order Form</h2>
            <p>Tell us what you would like, and we will get back to you with a quote.</p>

            <form action="#" method="post">
                <p>
                    <label for="name">Full Name:</label><br>
                    <input type="text" id="name" name="name" required>
                </p>

                <p>
                    <label for="contact">Contact Number or Email:</label><br>
                    <input type="text" id="contact" name="contact" required>
                </p>

                <p>
                    <label for="cakeType">Cake Type:</label><br>
                    <select id="cakeType" name="cakeType">
                        <option value="basic">Basic Cake (R300)</option>
                        <option value="custom">Custom Cake (From R500)</option>
                        <option value="premium">Premium Cake (From R650)</option>
                        <option value="cupcakes">Cupcakes</option>
                        <option value="bento">Bento Cake</option>
                    </select>
                </p>

                <p>
                    <label for="flavour">Preferred Flavour:</label><br>
                    <select id="flavour" name="flavour">
                        <option value="chocolate">Chocolate</option>
                        <option value="vanilla">Vanilla</option>
                        <option value="blueberry">Blueberry</option>
                        <option value="caramel">Caramel</option>
                        <option value="redvelvet">Red Velvet</option>
                        <option value="carrot">Carrot</option>
                    </select>
                </p>

                <p>
                    <label for="description">Describe What You Want:</label><br>
                    <textarea id="description" name="description" rows="5" cols="40"></textarea>
                </p>

                <p>
                    <label for="picture">Upload a Reference Picture:</label><br>
                    <input type="file" id="picture" name="picture" accept="image/*">
                </p>

                <p>
                    <label for="allergies">Allergies or Dietary Restrictions:</label><br>
                    <textarea id="allergies" name="allergies" rows="3" cols="40"></textarea>
                </p>

                <p>
                    <input type="submit" value="Submit Order Request">
                </p>
            </form>
        </section>
    </main>

    <footer>
        <p>Divine Delights &mdash; Pretoria West, South Africa</p>
    </footer>

</body>
</html>
