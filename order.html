<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Divine Delights | Order a Cake</title>

    <link rel="stylesheet" href="css\styles.css">
</head>
<body>

    <header>
        <div class="brand">
            <img src="images/logo.jpg" alt="Divine Delights logo" width="60" height="60">
            <div class="brand-text">
                <h1>Divine Delights</h1>
                <p class="tagline">Made with Love, Served with Honor</p>
            </div>
        </div>
        <nav>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about_us.html">About Us</a></li>
                <li><a href="menu.html">Menu &amp; Prices</a></li>
                <li><a class="current" href="order.html">Order a Cake</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
        <a class="whatsapp header-button" href="https://wa.me/27751999013" target="_blank" rel="noopener">WhatsApp</a>
    </header>

    <main>
        <section class="hero">
            <h2>Custom cake order form</h2>
            <p>Tell us what you would like and we will get back to you with a quote.</p>
        </section>

        <section>
            <!-- novalidate turns off the browser's own pop-up messages,
                 so our messages under each box show instead -->
            <form id="orderForm" action="#" method="post" novalidate>

                <div class="field">
                    <label for="firstname">First name</label>
                    <input type="text" id="firstname" name="firstname">
                    <p class="error" id="firstname-error"></p>
                </div>

                <div class="field">
                    <label for="surname">Surname</label>
                    <input type="text" id="surname" name="surname">
                    <p class="error" id="surname-error"></p>
                </div>

                <div class="field">
                    <label for="contact">Contact number or email</label>
                    <input type="text" id="contact" name="contact">
                    <p class="error" id="contact-error"></p>
                </div>

                <div class="field">
                    <label for="cakeType">Cake type</label>
                    <select id="cakeType" name="cakeType">
                        <option value="basic">Basic cake (R300)</option>
                        <option value="custom">Custom cake (from R500)</option>
                        <option value="premium">Premium cake (from R650)</option>
                        <option value="cupcakes">Cupcakes</option>
                        <option value="bento">Bento cake</option>
                    </select>
                </div>

                <div class="field">
                    <label for="flavour">Preferred flavour</label>
                    <select id="flavour" name="flavour">
                        <option value="chocolate">Chocolate</option>
                        <option value="vanilla">Vanilla</option>
                        <option value="blueberry">Blueberry</option>
                        <option value="caramel">Caramel</option>
                        <option value="redvelvet">Red velvet</option>
                        <option value="carrot">Carrot</option>
                    </select>
                </div>

                <div class="field">
                    <label for="description">Describe what you want</label>
                    <textarea id="description" name="description" rows="5"></textarea>
                    <p class="error" id="description-error"></p>
                </div>

                <div class="field">
                    <label for="picture">Upload a reference picture (optional)</label>
                    <input type="file" id="picture" name="picture" accept="image/*">
                </div>

                <div class="field">
                    <label for="allergies">Allergies or dietary restrictions (optional)</label>
                    <textarea id="allergies" name="allergies" rows="3"></textarea>
                </div>

                <button class="button" type="submit">Send order request</button>
                <p class="success" id="success"></p>
            </form>
        </section>
    </main>

    <footer>
        <p>Divine Delights &mdash; Pretoria West, South Africa</p>
    </footer>

    <a class="whatsapp whatsapp-float" href="https://wa.me/27751999013" target="_blank" rel="noopener">Chat on WhatsApp</a>

    <script src="js/script.js"></script>

</body>
</html>
